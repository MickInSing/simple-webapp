# Local test only (Step 2). Runs the app + Postgres with Docker Compose.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: changeme
    volumes:
      - dbdata:/var/lib/postgresql/data

  web:
    build: ./app
    image: webapp:1.0.0
    environment:
      APP_TITLE: "My Team Directory (local)"
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASSWORD: changeme
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  dbdata:
