apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate = stop the old pod before starting the new one.
  # Needed because only one pod at a time can mount the ReadWriteOnce DB volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webapp.selectorLabels" . | nindent 8 }}
      annotations:
        # Restart pods automatically when the secret changes
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        # ---------------- Container 1: the web app ----------------
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: APP_TITLE
              value: {{ .Values.appTitle | quote }}
            - name: DB_HOST
              value: "127.0.0.1"          # same pod = same network namespace
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: {{ include "webapp.fullname" . }}-db, key: POSTGRES_DB } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ include "webapp.fullname" . }}-db, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "webapp.fullname" . }}-db, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}

        # ---------------- Container 2: the database ----------------
        - name: db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "webapp.fullname" . }}-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # subfolder avoids "lost+found" issues
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}

      volumes:
        - name: db-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "webapp.fullname" . }}-db-data
          {{- else }}
          emptyDir: {}
          {{- end }}
