# The WEB tier: stateless, so it can have several replicas and rolling updates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  # RollingUpdate = start new pods before stopping old ones (zero downtime).
  # Possible now that the pod has no database volume attached.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "webapp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "webapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      # Init containers run to completion BEFORE the main container starts.
      # This one waits until the database pod is accepting connections.
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          imagePullPolicy: {{ .Values.db.image.pullPolicy }}
          command:
            - sh
            - -c
            - until pg_isready -h "$DB_HOST" -p 5432; do echo "waiting for $DB_HOST"; sleep 2; done
          env:
            - name: DB_HOST
              value: {{ include "webapp.dbFullname" . }}
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: APP_TITLE
              value: {{ .Values.appTitle | quote }}
            - name: BANNER_IMAGE
              value: {{ .Values.bannerImage | quote }}
            - name: DB_HOST
              # The database Service's DNS name (was 127.0.0.1 when it shared the pod)
              value: {{ include "webapp.dbFullname" . }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: {{ include "webapp.fullname" . }}-db, key: POSTGRES_DB } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ include "webapp.fullname" . }}-db, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "webapp.fullname" . }}-db, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
